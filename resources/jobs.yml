
resources:
  pipelines:
    stream_pipeline:
      name: nmp-stream-${bundle.target}
      catalog: ${var.catalog}
      target: silver
      serverless: true
      libraries:
        - file:
            path: ../src/nmp/pipelines/dlt_stream.py
      configuration:
        kafka.bootstrap: "${var.kafka_bootstrap}"
        kafka.sasl: "true"
        secret.scope: nmp

  jobs:

    # ============================================================
    # INITIALISATION DES SCHEMAS
    # ============================================================

    init_schema:
      name: nmp-init-${bundle.target}

      tasks:
        - task_key: ops
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/00_ops/001_schemas_ops.sql
            parameters:
              catalog: "${var.catalog}"

        - task_key: vault
          depends_on:
            - task_key: ops
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/009_vault_schema.sql
            parameters:
              catalog: "${var.catalog}"

        - task_key: bv
          depends_on:
            - task_key: vault
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/02_business_vault/020_business_vault.sql
            parameters:
              catalog: "${var.catalog}"

        - task_key: gold
          depends_on:
            - task_key: bv
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/03_gold/030_gold.sql
            parameters:
              catalog: "${var.catalog}"


    # ============================================================
    # INGESTION BATCH COURANTE
    # ============================================================

    batch_ingest:
      name: nmp-batch-ingest-${bundle.target}

      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - "${var.alert_email}"

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.root_path}/artifacts/.internal/nmp-0.1.1-py3-none-any.whl"
              - "pyarrow>=15"

        - environment_key: enrich_env
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.root_path}/artifacts/.internal/nmp-0.1.1-py3-none-any.whl"
              - "pyarrow>=15"
              - "transformers>=4.41"
              - "torch>=2.2"

      tasks:

        - task_key: finnhub
          environment_key: serverless_env
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - ingest
              - --source
              - finnhub_news

        - task_key: alpaca_news
          environment_key: serverless_env
          max_retries: 2
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - ingest
              - --source
              - alpaca_news

        - task_key: sec_8k
          environment_key: serverless_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - ingest
              - --source
              - sec_8k

        - task_key: bars_backfill
          environment_key: serverless_env
          max_retries: 2
          min_retry_interval_millis: 60000
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - ingest
              - --source
              - alpaca_bars_1m

        - task_key: silver_news_batch
          depends_on:
            - task_key: finnhub
            - task_key: alpaca_news
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/015_silver_news_batch.sql
            parameters:
              catalog: "${var.catalog}"

        - task_key: vault_news_batch
          depends_on:
            - task_key: silver_news_batch
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/016_vault_news_batch.sql
            parameters:
              catalog: "${var.catalog}"

        - task_key: silver_bars_batch
          depends_on:
            - task_key: bars_backfill
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/017_silver_bars_batch.sql
            parameters:
              catalog: "${var.catalog}"

        - task_key: vault_bars_batch
          depends_on:
            - task_key: silver_bars_batch
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/018_vault_bars_batch.sql
            parameters:
              catalog: "${var.catalog}"

        - task_key: enrich
          environment_key: enrich_env
          depends_on:
            - task_key: vault_news_batch
            - task_key: sec_8k
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - enrich

        - task_key: car
          environment_key: serverless_env
          depends_on:
            - task_key: enrich
            - task_key: vault_bars_batch
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - car

        - task_key: health
          environment_key: serverless_env
          depends_on:
            - task_key: car
          run_if: ALL_DONE
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - health


    # ============================================================
    # BACKFILL HISTORIQUE MANUEL DES BARRES
    # ============================================================

    backfill_bars:
      name: nmp-bars-backfill-${bundle.target}
      max_concurrent_runs: 1

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.root_path}/artifacts/.internal/nmp-0.1.1-py3-none-any.whl"
              - "pyarrow>=15"

      tasks:

        - task_key: backfill
          environment_key: serverless_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - backfill-bars
              - --start
              - "2026-08-03T00:00:00Z"
              - --end
              - "2026-11-07T00:00:00Z"

        - task_key: silver_bars
          depends_on:
            - task_key: backfill
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/017_silver_bars_batch.sql
            parameters:
              catalog: "${var.catalog}"

        - task_key: vault_bars
          depends_on:
            - task_key: silver_bars
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/018_vault_bars_batch.sql
            parameters:
              catalog: "${var.catalog}"


    # ============================================================
    # INGESTION QUOTIDIENNE
    # ============================================================

    daily_batch:
      name: nmp-daily-${bundle.target}

      schedule:
        quartz_cron_expression: "0 30 22 ? * MON-FRI"
        timezone_id: America/New_York
        pause_status: PAUSED

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.root_path}/artifacts/.internal/nmp-0.1.1-py3-none-any.whl"
              - "pyarrow>=15"

      tasks:

        - task_key: yahoo
          environment_key: serverless_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - ingest
              - --source
              - yahoo_daily
              - --lookback-days
              - "7"

        - task_key: gdelt
          environment_key: serverless_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - ingest
              - --source
              - gdelt

        - task_key: reddit
          environment_key: serverless_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - ingest
              - --source
              - reddit

        - task_key: finnhub_sent
          environment_key: serverless_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - ingest
              - --source
              - finnhub_sentiment


    # ============================================================
    # ENTRAINEMENT DES MODELES
    # ============================================================

    train_models:
      name: nmp-train-${bundle.target}

      schedule:
        quartz_cron_expression: "0 0 3 ? * SUN"
        timezone_id: UTC
        pause_status: PAUSED

      environments:
        - environment_key: ml_env
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.root_path}/artifacts/.internal/nmp-0.1.1-py3-none-any.whl"
              - "pyarrow>=15"
              - "scikit-learn>=1.4"
              - "xgboost>=2.0"
              - "mlflow>=2.14"

      tasks:

        - task_key: train
          environment_key: ml_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - train

        - task_key: publish
          environment_key: ml_env
          depends_on:
            - task_key: train
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - publish
