resources:
  jobs:
    yahoo_to_vault_job:
      name: nmp-yahoo-to-vault-${bundle.target}
      tasks:
        - task_key: yahoo_daily_to_vault
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/018b_yahoo_daily.sql
            parameters:
              catalog: "${var.catalog}"
