resources:
  jobs:
    finnhub_backfill:
      name: nmp-finnhub-backfill-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 3600

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.root_path}/artifacts/.internal/nmp-0.1.1-py3-none-any.whl"
              - "pyarrow>=15"

      tasks:
        - task_key: finnhub_backfill
          environment_key: serverless_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - backfill-finnhub
              - --start
              - "2026-11-16"
              - --end
              - "2026-11-20"
