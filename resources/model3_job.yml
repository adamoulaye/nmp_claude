resources:
  jobs:
    model3:
      name: nmp-model3-${bundle.target}
      max_concurrent_runs: 1
      timeout_seconds: 5400

      environments:
        - environment_key: model3_env
          spec:
            environment_version: "2"
            dependencies:
              - "${workspace.root_path}/artifacts/.internal/nmp-0.1.1-py3-none-any.whl"
              - "pyarrow>=15"
              - "scikit-learn>=1.4"
              - "statsmodels>=0.14,<0.15"

      tasks:
        - task_key: anomalies
          environment_key: model3_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - anomalies

        - task_key: granger
          environment_key: model3_env
          python_wheel_task:
            package_name: nmp
            entry_point: nmp
            parameters:
              - --catalog
              - "${var.catalog}"
              - granger
