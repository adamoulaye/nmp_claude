resources:
  jobs:
    stream_to_vault_job:
      name: nmp-stream-to-vault-${bundle.target}
      tasks:
        - task_key: vault_stream
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/01_vault/019_vault_stream.sql
            parameters:
              catalog: "${var.catalog}"
