name: CD
on:
  push: {branches: [main]}
  release: {types: [published]}
permissions: {contents: read, id-token: write, packages: write}

env:
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env: {DATABRICKS_HOST: "${{ secrets.DATABRICKS_HOST }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t staging --var="warehouse_id=${{ vars.WAREHOUSE_ID }}"
      - name: Initialiser schémas / vault / gold
        run: databricks bundle run init_schema -t staging --var="warehouse_id=${{ vars.WAREHOUSE_ID }}"
      - name: Test de fumée (ingestion + enrichissement)
        run: databricks bundle run batch_ingest -t staging --var="warehouse_id=${{ vars.WAREHOUSE_ID }}"

  image:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: "ghcr.io/${{ github.repository }}/streamer:${{ github.event.release.tag_name }}"}

  prod:
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-latest
    environment: production        # approbation manuelle requise
    env: {DATABRICKS_HOST: "${{ secrets.DATABRICKS_HOST_PROD }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod --var="warehouse_id=${{ vars.WAREHOUSE_ID_PROD }}"
