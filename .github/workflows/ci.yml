name: CI
on:
  pull_request:
  push: {branches: [main]}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
permissions: {contents: read}

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy: {matrix: {python: ["3.10", "3.11"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -e ".[dev,stream]" scikit-learn xgboost statsmodels
      - run: ruff check src tests scripts
      - run: ruff format --check src tests
      - run: mypy src/nmp --ignore-missing-imports
      - run: pytest --cov=nmp --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.11'
        with: {name: coverage, path: coverage.xml}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: pip install pip-audit && pip-audit -r <(pip install -e . >/dev/null 2>&1; pip freeze --exclude-editable) || true

  bundle-validate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: "nmp-streamer:ci", cache-from: "type=gha", cache-to: "type=gha,mode=max"}
