# Environnement local : Kafka compatible (Redpanda) + MLflow + les deux flux Alpaca.
name: nmp
x-streamer: &streamer
  build: .
  env_file: .env
  environment: {KAFKA_BOOTSTRAP: "redpanda:9092"}
  depends_on: {redpanda: {condition: service_healthy}}
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]

services:
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command: [redpanda, start, --smp, "1", --memory, 1G, --overprovisioned, --node-id, "0",
              --kafka-addr, "PLAINTEXT://0.0.0.0:9092", --advertise-kafka-addr, "PLAINTEXT://redpanda:9092"]
    ports: ["9092:9092"]
    healthcheck: {test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"], interval: 10s, timeout: 5s, retries: 12}
    volumes: [redpanda-data:/var/lib/redpanda/data]

  redpanda-init:
    image: redpandadata/redpanda:v24.1.7
    depends_on: {redpanda: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c", "rpk -X brokers=redpanda:9092 topic create raw.news raw.bars -p 3 || true"]
    restart: "no"

  console:
    image: redpandadata/console:v2.6.0
    environment: {KAFKA_BROKERS: "redpanda:9092"}
    ports: ["8080:8080"]
    depends_on: [redpanda]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow-data:/mlflow]

  stream-news:
    <<: *streamer
    command: ["news"]
  stream-bars:
    <<: *streamer
    command: ["bars"]

  tests:
    build: {context: ., target: builder}
    profiles: [test]
    command: sh -c "pip install -e '.[dev]' && pytest"
    volumes: [".:/build"]

volumes: {redpanda-data: {}, mlflow-data: {}}
